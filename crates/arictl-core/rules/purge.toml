category_id = "purge"
category_label = "Project Build Artifacts"

# Scans ~ at depth 1-2 for known build output directories.
# Safety: hidden dirs excluded, project indicator required,
# exclude_indicators protect non-matching project types,
# min_age_days = 7 protects recently modified builds.
# Override paths via ~/.config/arictl/rules/purge.toml.

# ── Rust ─────────────────────────────────────────────────────

[[items]]
id = "rust_target"
label = "Rust target/ directories"
paths = ["~"]
strategy = "remove_subdirs"
strategy_args = { subdir = "target", indicators = ["Cargo.lock"], min_age_days = 7 }
min_size = 104857600

# ── JavaScript / TypeScript ─────────────────────────────────

[[items]]
id = "node_modules"
label = "JS/TS node_modules/ directories"
paths = ["~"]
strategy = "remove_subdirs"
strategy_args = { subdir = "node_modules", indicators = ["package-lock.json", "yarn.lock", "pnpm-lock.yaml", "bun.lock"], min_age_days = 7 }
min_size = 104857600

