# ── Xcode ──────────────────────────────────────────────────

[[items]]
id = "xcode_derived"
label = "Xcode DerivedData"
paths = ["~/Library/Developer/Xcode/DerivedData"]
strategy = "remove_contents"
min_size = 10485760

[[items]]
id = "xcode_documentation_cache"
label = "Xcode Documentation Cache"
paths = ["/Library/Developer/Xcode/DocumentationCache"]
strategy = "remove_contents"
min_size = 10485760

[[items]]
