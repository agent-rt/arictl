[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
shellexpand = "3"
toml = "0.8"
rayon = "1"
trash = "5"
colored = "3"
dialoguer = "0.12"
